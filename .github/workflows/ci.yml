name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: "17"
  NODE_VERSION: "22"
  GRADLE_ARGS: --no-daemon
  WASM_ARTIFACT_NAME: wasm-release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Verify runtimes
        run: |
          java -version
          node --version
          wasmtime --version

      - name: Build
        run: ./gradlew ${{ env.GRADLE_ARGS }} assemble

  unit-and-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Node pipe tests
        run: ./gradlew ${{ env.GRADLE_ARGS }} wasmWasiNodeTest wasmWasiNodePipeE2eTest

  e2e-wasmtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Wasmtime e2e
        run: ./gradlew ${{ env.GRADLE_ARGS }} wasmWasiE2eTest

  package-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build release artifacts
        run: ./gradlew ${{ env.GRADLE_ARGS }} packageWasmRelease

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WASM_ARTIFACT_NAME }}
          path: |
            build/distributions/non-browser-wasm.wasm
            build/distributions/non-browser-wasm.mjs
            build/distributions/SHA256SUMS.txt
